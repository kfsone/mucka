name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-gioui-${{ runner.os }}-v1

      - name: Install system dependencies
        run: |
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" == "true" ]; then
            sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
          else
            sudo apt-get update -qq
          fi
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-xcb-dev \
            pkg-config \
            xorg-dev
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/apt-archives
            cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test $(go list ./... | grep -v 'cmd/')
