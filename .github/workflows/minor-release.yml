name: Minor Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute and write release version
        id: ver
        run: |
          python3 - <<'PYEOF'
          import json, re, subprocess, os, sys

          with open('version.json') as f:
              v = json.load(f)
          current = v['version']

          base = re.sub(r'-rc\d+$', '', current)
          major, minor, patch = (int(x) for x in base.split('.'))

          if patch != 0:
              print(f"::error::Current version {current} is not a minor release candidate (patch must be 0). Run Minor RC first.")
              sys.exit(1)

          tags = subprocess.check_output(['git', 'tag', '-l', f'v{base}-rc*']).decode().split()
          if not tags:
              print(f"::error::No RC tags found for v{base}. Run Minor RC first.")
              sys.exit(1)

          new_version = base
          print(f"Releasing: {new_version}")

          v['version'] = new_version
          with open('version.json', 'w') as f:
              json.dump(v, f, indent=2)
              f.write('\n')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={new_version}\n")
          PYEOF

      - name: Commit, tag, push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: release v${{ steps.ver.outputs.version }}"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "Release ${{ steps.ver.outputs.version }}"
          git push
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Trigger release build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "v${{ steps.ver.outputs.version }}"
