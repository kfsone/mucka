name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # MinVer needs full history to resolve version from tags

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build -f net10.0-windows10.0.19041.0 -c Release

      - name: Test
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter "*.Tests.csproj" -ErrorAction SilentlyContinue
          if ($tests.Count -gt 0) {
            dotnet test --no-build -c Release --logger "console;verbosity=normal"
          } else {
            Write-Host "No test projects found — skipping"
          }

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build -f net10.0-android -c Release

  build-maccatalyst:
    name: Build (macOS Catalyst)
    # .NET 10 MacCatalyst SDK packs (26.5.x) require Xcode 26.5, which ships
    # with macOS 26 (Tahoe). macos-latest resolves to macos-15 (Xcode 16.4);
    # macos-26 is the explicit label for the macOS 26 Arm64 runner with Xcode 26.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-maccatalyst-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-maccatalyst-

      - name: Install MAUI macOS Catalyst workload
        run: dotnet workload install maui-maccatalyst

      - name: Build
        run: dotnet build -f net10.0-maccatalyst -c Release -p:RuntimeIdentifier=maccatalyst-arm64
