name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        shell: pwsh
        run: |
          # The .NET SDK detects VS via ISetupConfiguration COM (reads _Instances dir)
          # and installs packs for all VS-registered workloads (ios, android, maccatalyst...).
          # Temporarily hide that directory so only maui-windows packs are installed.
          $vsInst = "$env:ProgramData\Microsoft\VisualStudio\Packages\_Instances"
          $vsBack = "${vsInst}_ci_bak"
          if (Test-Path $vsInst) { Rename-Item $vsInst $vsBack }
          try {
            dotnet workload install maui-windows --skip-sign-check --skip-manifest-update
          } finally {
            if (Test-Path $vsBack) { Rename-Item $vsBack $vsInst }
          }

      - name: Build
        run: dotnet build Mucka.slnx -c Debug

      - name: Test
        run: dotnet test Mucka.slnx --no-build -c Debug --logger "console;verbosity=normal"

  build-macos:
    name: Build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The MAUI Mac Catalyst packs are built against one Xcode: the one the operator builds with (26.6, build 17F113), on the macOS 26 image that carries it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-macos-

      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst --skip-sign-check --version 10.0.400

      - name: Build
        run: dotnet build Mucka.csproj -f net10.0-maccatalyst -c Debug

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Cache MAUI workload packs
        id: workload-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
          key: workloads-maui-android-${{ runner.os }}-${{ hashFiles('global.json') }}

      - name: Install MAUI Android workload
        if: steps.workload-cache.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android --skip-sign-check

      - name: Build
        run: dotnet build Mucka.slnx -c Debug

      - name: Test
        run: dotnet test Mucka.slnx --no-build -c Debug --logger "console;verbosity=normal"
