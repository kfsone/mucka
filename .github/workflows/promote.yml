name: Promote Stage

# Manually promote the version stage: alpha → beta → rc → release.
#
# For non-release promotions: updates version.json and commits.
# For 'release':
#   1. Commits version.json with stage=release  (the release tag lands here)
#   2. Creates annotated tag v{next}  →  triggers release.yml
#   3. Commits the post-release reset (stage=alpha, baseVersion={next})
#
# NOTE: 'main' must allow pushes from github-actions[bot].
#       In a branch-protection setup, add it as a bypass actor, or supply a
#       PAT via secrets.RELEASE_PAT and set token: ${{ secrets.RELEASE_PAT }}.

on:
  workflow_dispatch:
    inputs:
      new_stage:
        description: 'Target stage (must be a forward move from current stage)'
        required: true
        type: choice
        options:
          - beta
          - rc
          - release

permissions:
  contents: write

jobs:
  promote:
    name: Promote → ${{ inputs.new_stage }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT if one is provided; falls back to the default GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify branch is main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Promote must be run on 'main', not '${{ github.ref_name }}'"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Read current state and compute next version ───────────────────────
      - name: Compute version info
        id: ver
        shell: pwsh
        run: |
          $info         = Get-Content version.json | ConvertFrom-Json
          $currentStage = [string]$info.stage
          $baseVersion  = [string]$info.baseVersion

          # Compute the next semver string via the script
          $semver      = & ./scripts/Get-Version.ps1
          # Strip any pre-release suffix to get the clean next version (e.g. "0.2.0-alpha.3" → "0.2.0")
          $nextVersion = $semver -replace '-.*', ''

          echo "current_stage=$currentStage" >> $env:GITHUB_OUTPUT
          echo "base_version=$baseVersion"   >> $env:GITHUB_OUTPUT
          echo "next_version=$nextVersion"   >> $env:GITHUB_OUTPUT
          echo "semver=$semver"              >> $env:GITHUB_OUTPUT
          Write-Host "Current: $currentStage @ $baseVersion  →  next would be $semver"

      # ── Validate the transition is a legal forward move ───────────────────
      - name: Validate transition
        shell: pwsh
        run: |
          $from = "${{ steps.ver.outputs.current_stage }}"
          $to   = "${{ inputs.new_stage }}"

          $allowed = @{
            'alpha' = @('beta', 'rc', 'release')
            'beta'  = @('rc',        'release')
            'rc'    = @(             'release')
          }

          if (-not $allowed.ContainsKey($from)) {
            throw "Cannot promote: current stage '$from' is not a promotable stage. " +
                  "Run the promote workflow again after a post-release reset."
          }
          if ($to -notin $allowed[$from]) {
            $valid = $allowed[$from] -join ', '
            throw "Invalid transition: $from → $to. Valid targets from '$from': $valid"
          }
          Write-Host "Transition OK: $from → $to"

      # ══ Non-release promotion (alpha→beta, alpha→rc, beta→rc) ════════════
      - name: Update stage (non-release)
        if: inputs.new_stage != 'release'
        shell: pwsh
        run: |
          $info       = Get-Content version.json | ConvertFrom-Json
          $info.stage = "${{ inputs.new_stage }}"
          $info | ConvertTo-Json -Depth 5 | Set-Content version.json
          git add version.json
          git commit -m "chore(version): promote stage → ${{ inputs.new_stage }}"
          git push

      # ══ Release promotion ═════════════════════════════════════════════════
      # Step 1: stamp version.json as stage=release and tag that commit.
      - name: Stamp release commit
        if: inputs.new_stage == 'release'
        shell: pwsh
        run: |
          $next = "${{ steps.ver.outputs.next_version }}"
          $info       = Get-Content version.json | ConvertFrom-Json
          $info.stage = 'release'
          $info | ConvertTo-Json -Depth 5 | Set-Content version.json
          git add version.json
          git commit -m "chore(release): $next"

      - name: Create release tag
        if: inputs.new_stage == 'release'
        run: |
          TAG="v${{ steps.ver.outputs.next_version }}"
          git tag -a "$TAG" -m "Release ${{ steps.ver.outputs.next_version }}"
          echo "Created tag $TAG"

      # Step 2: immediately reset to alpha for next development cycle.
      - name: Reset to post-release alpha
        if: inputs.new_stage == 'release'
        shell: pwsh
        run: |
          $next       = "${{ steps.ver.outputs.next_version }}"
          $info       = Get-Content version.json | ConvertFrom-Json
          $info.stage       = 'alpha'
          $info.baseVersion = $next
          $info | ConvertTo-Json -Depth 5 | Set-Content version.json
          git add version.json
          git commit -m "chore(version): begin post-$next development"

      - name: Push commits and tag
        if: inputs.new_stage == 'release'
        run: |
          git push
          git push origin "v${{ steps.ver.outputs.next_version }}"
