name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version label (e.g. v0.1.0) — for artifact naming only, not a real tag'
        required: false
        default: 'manual'

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────
  release-windows:
    name: Release (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Publish (Windows installer)
        shell: pwsh
        run: |
          dotnet publish -f net10.0-windows10.0.19041.0 -c Release `
            "-p:TargetFrameworks=net10.0-windows10.0.19041.0" `
            -p:ApplicationVersion=${{ github.run_number }} `
            -p:CreateWindowsInstaller=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:AppxPackageBuildPlatform=x64 `
            -p:RuntimeIdentifierOverride=win10-x64 `
            -p:EnableMsixTooling=true

      - name: Zip Windows installer
        shell: pwsh
        run: |
          $pkgDir = Get-ChildItem -Path "bin" -Filter "Add-AppDevPackage.ps1" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Directory.Name -like "*_Test" -and
              (Get-ChildItem -Path $_.Directory.FullName -Filter "*.msix" -File -ErrorAction SilentlyContinue | Select-Object -First 1)
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty Directory

          if (-not $pkgDir) {
            throw "No *_Test AppPackage under bin containing Add-AppDevPackage.ps1 and an .msix was found."
          }

          $zip = "mucka-windows-${{ env.RELEASE_TAG }}.zip"
          Compress-Archive -Path "$($pkgDir.FullName)/*" -DestinationPath $zip
          Write-Host "Created $zip from $($pkgDir.FullName)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: mucka-windows-${{ env.RELEASE_TAG }}.zip

  # ── Android ──────────────────────────────────────────────────────────────
  release-android:
    name: Release (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mucka-release.jks
            echo "HAVE_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Publish (Android)
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ "${HAVE_KEYSTORE}" = "true" ]; then
            dotnet publish -f net10.0-android -c Release \
              -p:TargetFrameworks=net10.0-android \
              -p:EnableWindowsTargeting=true \
              -p:ApplicationVersion=${{ github.run_number }} \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=mucka-release.jks \
              "-p:AndroidSigningKeyAlias=${ANDROID_KEY_ALIAS}" \
              "-p:AndroidSigningKeyPass=${ANDROID_KEY_PASSWORD}" \
              "-p:AndroidSigningStorePass=${ANDROID_STORE_PASSWORD}"
          else
            dotnet publish -f net10.0-android -c Release \
              -p:TargetFrameworks=net10.0-android \
              -p:EnableWindowsTargeting=true \
              -p:ApplicationVersion=${{ github.run_number }}
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          apk=$(find bin/Release/net10.0-android -name "*.apk" | head -1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          cp "$apk" "mucka-android-${{ env.RELEASE_TAG }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: mucka-android-${{ env.RELEASE_TAG }}.apk

  # ── GitHub Release ────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [release-windows, release-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: mucka ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
