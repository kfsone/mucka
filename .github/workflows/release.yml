name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -- Windows --------------------------------------------------------------
  windows:
    name: Windows (zip + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        shell: pwsh
        run: |
          # The .NET SDK detects VS via ISetupConfiguration COM (reads _Instances dir)
          # and installs packs for all VS-registered workloads (ios, android, maccatalyst...).
          # Temporarily hide that directory so only maui-windows packs are installed.
          $vsInst = "$env:ProgramData\Microsoft\VisualStudio\Packages\_Instances"
          $vsBack = "${vsInst}_ci_bak"
          if (Test-Path $vsInst) { Rename-Item $vsInst $vsBack }
          try {
            dotnet workload install maui-windows --skip-sign-check --skip-manifest-update
          } finally {
            if (Test-Path $vsBack) { Rename-Item $vsBack $vsInst }
          }

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish Mucka.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:MUCKA_RELEASE_VERSION=$version `
            -p:ApplicationVersion=${{ github.run_number }}

      - name: Strip PDB files
        shell: pwsh
        run: |
          $pdbs = Get-ChildItem bin\Release -Recurse -Filter *.pdb
          $pdbs | Remove-Item -Force
          Write-Host "Stripped $($pdbs.Count) PDB file(s)"

      - name: Sign executable
        shell: pwsh
        env:
          CERT_PFX_B64:  ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PFX_PASS: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          $pfxPath = [IO.Path]::Combine([IO.Path]::GetTempPath(), "mucka-sign.pfx")
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_PFX_B64))
          try {
            $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
            if (-not $tool) {
              $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter signtool.exe `
                        -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64' } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $tool) { throw "signtool.exe not found" }
            $exe = Get-ChildItem bin\Release -Recurse -Filter Mucka.exe |
              Where-Object { $_.FullName -notlike '*\ref\*' } |
              Select-Object -First 1
            if (-not $exe) { throw "Mucka.exe not found" }
            & $tool sign /f $pfxPath /p $env:CERT_PFX_PASS `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
            Write-Host "Signed -> $($exe.FullName)"
            echo "APP_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Zip (loose files)
        shell: pwsh
        run: |
          $zip = "mucka-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$env:APP_DIR\*" -DestinationPath $zip
          Write-Host "Zipped $env:APP_DIR -> $zip"

      - name: Download Windows App Runtime installer
        shell: pwsh
        run: |
          # Bundled so the installer works on machines that don't already have
          # the Windows App SDK framework package (required by MAUI/WinUI 3).
          $url = "https://aka.ms/windowsappsdk/1.7/latest/windowsappruntimeinstall-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile windowsappruntimeinstall-x64.exe -UseBasicParsing
          Write-Host "Downloaded Windows App Runtime installer: $((Get-Item windowsappruntimeinstall-x64.exe).Length) bytes"

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DMyAppDir=$env:APP_DIR" `
            installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

      - name: Sign installer
        shell: pwsh
        env:
          CERT_PFX_B64:  ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PFX_PASS: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          $pfxPath = [IO.Path]::Combine([IO.Path]::GetTempPath(), "mucka-sign.pfx")
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_PFX_B64))
          try {
            $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
            if (-not $tool) {
              $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter signtool.exe `
                        -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64' } |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $tool) { throw "signtool.exe not found" }
            $dest = "mucka-windows-${{ github.ref_name }}-setup.exe"
            Rename-Item mucka-setup.exe $dest
            & $tool sign /f $pfxPath /p $env:CERT_PFX_PASS `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $dest
            if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
            Write-Host "Signed -> $dest"
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: mucka-windows-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: mucka-windows-${{ github.ref_name }}-setup.exe

  # -- Android --------------------------------------------------------------
  android-apk:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Cache MAUI Android workload
        id: cache-maui-android
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.DOTNET_ROOT }}/packs
            ${{ env.DOTNET_ROOT }}/sdk-manifests
          key: maui-android-${{ hashFiles('global.json') }}

      - name: Install MAUI Android workload
        if: steps.cache-maui-android.outputs.cache-hit != 'true'
        run: dotnet workload install maui-android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mucka-release.jks
            echo "HAVE_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Publish
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          if [ "${HAVE_KEYSTORE}" = "true" ]; then
            dotnet publish Mucka.csproj -f net10.0-android -c Release \
              -p:EnableWindowsTargeting=true \
              -p:MUCKA_RELEASE_VERSION="${version}" \
              -p:ApplicationVersion=${{ github.run_number }} \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=mucka-release.jks \
              "-p:AndroidSigningKeyAlias=${ANDROID_KEY_ALIAS}" \
              "-p:AndroidSigningKeyPass=${ANDROID_KEY_PASSWORD}" \
              "-p:AndroidSigningStorePass=${ANDROID_STORE_PASSWORD}"
          else
            dotnet publish Mucka.csproj -f net10.0-android -c Release \
              -p:EnableWindowsTargeting=true \
              -p:MUCKA_RELEASE_VERSION="${version}" \
              -p:ApplicationVersion=${{ github.run_number }}
          fi

      - name: Rename APK
        run: |
          apk=$(find bin -name "*.apk" | head -1)
          if [ -z "$apk" ]; then echo "No APK found"; exit 1; fi
          cp "$apk" "mucka-android-${{ github.ref_name }}.apk"
          echo "APK: $apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mucka-android-${{ github.ref_name }}.apk

  # -- macOS ----------------------------------------------------------------
  macos:
    name: macOS (app, universal)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-macos-

      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst --skip-sign-check --version 10.0.400

      # CI=true is set on the runner, which makes Mucka.csproj build both Intel and Apple Silicon and
      # merge them into one universal app. A local Release build is the host architecture only.
      - name: Build
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          dotnet build Mucka.csproj -f net10.0-maccatalyst -c Release \
            -p:MUCKA_RELEASE_VERSION="${version}" \
            -p:ApplicationVersion=${{ github.run_number }}

      # The merged app is the one at this path. The per-architecture folders beside it hold
      # bundles without the sounds or the icon.
      - name: Locate the app
        run: |
          app="bin/Release/net10.0-maccatalyst/Mucka.app"
          if [ ! -d "$app" ]; then echo "Universal Mucka.app not found at $app"; find bin -name Mucka.app; exit 1; fi
          if [ ! -f "$app/Contents/Resources/mucka_theme.wav" ]; then echo "$app has no sounds"; exit 1; fi
          echo "APP=$app" >> "$GITHUB_ENV"

      # Ad-hoc signed: it costs no Apple account and does not expire. It is not notarized, so an
      # archive downloaded in a browser needs "Open Anyway" in System Settings > Privacy & Security;
      # an archive fetched with curl is not quarantined and opens normally.
      - name: Sign (ad-hoc) and verify
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/Mucka"

      - name: Archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP" "mucka-macos-${{ github.ref_name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-zip
          path: mucka-macos-${{ github.ref_name }}.zip

  # -- iOS ------------------------------------------------------------------
  # A build check only: a simulator app, signed ad hoc. Nothing is uploaded and the release does not
  # wait on it. The signed device build is ios-testflight, below.
  ios:
    name: iOS (simulator build check)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-ios-

      # Both: with LocalIos=true the project lists net10.0-maccatalyst as well, and restore evaluates
      # every listed target framework even when the build names one.
      - name: Install MAUI iOS and Mac Catalyst workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-sign-check --version 10.0.400

      # actool compiles the app icon and needs a Simulator runtime matching Xcode's iOS SDK.
      - name: Simulator runtimes present
        run: xcrun simctl runtime list

      - name: Build
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          dotnet build Mucka.csproj -f net10.0-ios -c Release -r iossimulator-arm64 \
            -p:LocalIos=true \
            -p:MUCKA_RELEASE_VERSION="${version}" \
            -p:ApplicationVersion=${{ github.run_number }}

      - name: Check the app
        run: |
          app="bin/Release/net10.0-ios/iossimulator-arm64/Mucka.app"
          if [ ! -d "$app" ]; then echo "Mucka.app not found at $app"; find bin -name Mucka.app; exit 1; fi
          if [ ! -f "$app/mucka_theme.wav" ]; then echo "$app has no sounds"; exit 1; fi
          codesign --verify --deep --strict "$app"

  # -- iOS TestFlight ----------------------------------------------------------
  # A signed device build uploaded to App Store Connect, where it appears in TestFlight. Every step
  # after the first is skipped when the signing secrets are absent, and the GitHub release does not
  # wait on it. Secrets: IOS_DIST_CERT_P12 (base64 of the Apple Distribution certificate exported as
  # .p12), IOS_DIST_CERT_PASSWORD, IOS_APPSTORE_PROFILE (base64 of the App Store .mobileprovision for
  # org.kfs.mucka), ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (base64 of the App Store Connect API key).
  ios-testflight:
    name: iOS (TestFlight upload)
    runs-on: macos-26
    env:
      HAVE_SIGNING: ${{ secrets.IOS_DIST_CERT_P12 != '' && secrets.IOS_APPSTORE_PROFILE != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - name: Signing secrets present
        run: echo "HAVE_SIGNING=$HAVE_SIGNING"

      - uses: actions/checkout@v6
        if: env.HAVE_SIGNING == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        if: env.HAVE_SIGNING == 'true'
        with:
          global-json-file: global.json

      - uses: maxim-lobanov/setup-xcode@v1
        if: env.HAVE_SIGNING == 'true'
        with:
          xcode-version: '26.6'

      - name: Install MAUI iOS and Mac Catalyst workloads
        if: env.HAVE_SIGNING == 'true'
        run: dotnet workload install maui-ios maui-maccatalyst --skip-sign-check --version 10.0.400

      # A keychain of its own, so codesign finds the certificate without a password prompt.
      - name: Install the certificate and profile
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then echo "No Apple Distribution identity in the certificate"; exit 1; fi
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "CODESIGN_KEY=$identity" >> "$GITHUB_ENV"
          echo "CODESIGN_PROVISION=$name" >> "$GITHUB_ENV"

      # The run number is the build number, which App Store Connect needs to rise with every upload.
      - name: Publish the .ipa
        if: env.HAVE_SIGNING == 'true'
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          dotnet publish Mucka.csproj -f net10.0-ios -c Release -r ios-arm64 \
            -p:LocalIos=true \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$CODESIGN_PROVISION" \
            -p:MUCKA_RELEASE_VERSION="${version}" \
            -p:ApplicationVersion=${{ github.run_number }}
          ipa="$(find bin/Release/net10.0-ios/ios-arm64 -name '*.ipa' | head -1)"
          if [ -z "$ipa" ]; then echo "No .ipa produced"; find bin -name '*.ipa'; exit 1; fi
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        if: env.HAVE_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -t ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  # -- GitHub Release --------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [windows, android-apk, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          draft: ${{ contains(github.ref_name, '-rc') }}
          files: artifacts/*
