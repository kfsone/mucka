name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────
  windows-zip:
    name: Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish Mucka.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:MUCKA_RELEASE_VERSION=$version `
            -p:ApplicationVersion=${{ github.run_number }}

      - name: Sign executable
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          $exe = Get-ChildItem -Path bin\Release -Recurse -Filter Mucka.exe |
            Where-Object { $_.FullName -notlike '*\ref\*' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Mucka.exe not found for signing" }

          $pfx = [System.IO.Path]::GetTempFileName() + ".pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          try {
            signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASS `
              /t "http://timestamp.digicert.com" `
              /d "Mucka" $exe
            signtool verify /pa $exe
            Write-Host "Signed: $exe"
          } finally {
            Remove-Item $pfx -Force
          }

      - name: Zip
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path bin\Release -Recurse -Filter Mucka.exe |
            Where-Object { $_.FullName -notlike '*\ref\*' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Mucka.exe not found after publish" }
          $zip = "mucka-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath $zip
          Write-Host "Zipped $($exe.DirectoryName) → $zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: mucka-windows-${{ github.ref_name }}.zip

  # ── Android ──────────────────────────────────────────────────────────────
  android-apk:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mucka-release.jks
            echo "HAVE_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Publish
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          if [ "${HAVE_KEYSTORE}" = "true" ]; then
            dotnet publish Mucka.csproj -f net10.0-android -c Release \
              -p:EnableWindowsTargeting=true \
              -p:MUCKA_RELEASE_VERSION="${version}" \
              -p:ApplicationVersion=${{ github.run_number }} \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=mucka-release.jks \
              "-p:AndroidSigningKeyAlias=${ANDROID_KEY_ALIAS}" \
              "-p:AndroidSigningKeyPass=${ANDROID_KEY_PASSWORD}" \
              "-p:AndroidSigningStorePass=${ANDROID_STORE_PASSWORD}"
          else
            dotnet publish Mucka.csproj -f net10.0-android -c Release \
              -p:EnableWindowsTargeting=true \
              -p:MUCKA_RELEASE_VERSION="${version}" \
              -p:ApplicationVersion=${{ github.run_number }}
          fi

      - name: Rename APK
        run: |
          apk=$(find bin -name "*.apk" | head -1)
          if [ -z "$apk" ]; then echo "No APK found"; exit 1; fi
          cp "$apk" "mucka-android-${{ github.ref_name }}.apk"
          echo "APK: $apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mucka-android-${{ github.ref_name }}.apk

  # ── GitHub Release ────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [windows-zip, android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
