name: Tag Release

# Push a release tag on HEAD of main, which triggers release.yml.
# You can also just: git tag -a vX.Y.Z -m "Release X.Y.Z" && git push origin vX.Y.Z

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  tag:
    name: Tag v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify branch is main
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != "main" ]; then
            echo "::error::Must run on main, currently on '$branch'"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git tag -l "v${{ inputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Stamp version.json and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset version.json so dev builds after this release show the right base
          python3 -c "
          import json, sys
          with open('version.json') as f: v = json.load(f)
          v['stage'] = 'alpha'
          v['baseVersion'] = '${{ inputs.version }}'
          print(json.dumps(v, indent=2))
          " > version.json.new && mv version.json.new version.json

          git add version.json
          git commit -m "chore(version): begin post-${{ inputs.version }} development"
          git tag -a "v${{ inputs.version }}" HEAD~1 -m "Release ${{ inputs.version }}"
          git push
          git push origin "v${{ inputs.version }}"
