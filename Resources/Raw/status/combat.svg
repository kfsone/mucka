<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Solid disc, same "opaque circle" convention as every other status icon (glow/crippled/
         etc.) so it reads as one of the set in the status-bar cluster. Crimson = "in combat". -->
    <radialGradient id="cB-bloom" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#e0483f"/>
      <stop offset="100%" stop-color="#8c1712"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#cB-bloom)"/>
  <!-- crossed swords: two blades from lower hilt to upper tip, with a crossguard and a
       rounded hilt-cap on each, mirrored left/right. -->
  <g stroke="#f5f5f5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blade "/" : hilt bottom-right, tip top-left -->
    <line x1="352" y1="360" x2="150" y2="150" stroke-width="26"/>
    <line x1="243" y1="259" x2="279" y2="223" stroke-width="26"/> <!-- crossguard -->
    <circle cx="368" cy="376" r="24" fill="#f5f5f5"/>              <!-- hilt cap -->
    <!-- Blade "\" : hilt bottom-left, tip top-right -->
    <line x1="160" y1="360" x2="362" y2="150" stroke-width="26"/>
    <line x1="233" y1="259" x2="269" y2="295" stroke-width="26"/> <!-- crossguard -->
    <circle cx="144" cy="376" r="24" fill="#f5f5f5"/>              <!-- hilt cap -->
  </g>
</svg>
