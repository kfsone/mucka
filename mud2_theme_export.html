<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MUD II Theme — WAV Export</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; color: #222; }
  h2 { margin-bottom: 6px; }
  p { color: #555; margin-top: 0; }
  button { padding: 10px 24px; font-size: 15px; cursor: pointer; border-radius: 6px; border: 1px solid #888; background: #f5f5f5; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 14px; font-size: 14px; color: #444; min-height: 20px; }
</style>
</head>
<body>
<h2>MUD II · Theme of the Land</h2>
<p>Renders offline via OfflineAudioContext and downloads a stereo 44.1 kHz 16-bit WAV.</p>
<button id="btn" onclick="renderAndDownload()">Render &amp; Download WAV</button>
<div id="status"></div>

<script>
const DURATION = 10.4;
const RENDER_DURATION = 14.8; // DURATION + reverb tail (3.4s IR) + small margin
const SAMPLE_RATE = 44100;

function makeReverb(ctx) {
  const conv = ctx.createConvolver();
  const sr = ctx.sampleRate, len = Math.floor(sr * 3.4);
  const buf = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
  }
  conv.buffer = buf;
  return conv;
}

function renderTheme(ctx) {
  const t = 0.05;
  const D = DURATION;

  const master = ctx.createGain(); master.gain.value = 0.72; master.connect(ctx.destination);
  const rev = makeReverb(ctx);
  const revG = ctx.createGain(); revG.gain.value = 0.55;
  rev.connect(revG); revG.connect(master);
  const dry = ctx.createGain(); dry.gain.value = 0.45; dry.connect(master);

  // Bass drone D1 + D2
  [[36.71, 0.38, 'sawtooth'], [73.42, 0.22, 'triangle']].forEach(([f, v, type]) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 200; filt.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v,        t + 2.2);
    g.gain.linearRampToValueAtTime(v * 0.85, t + 6.5);
    g.gain.linearRampToValueAtTime(v * 0.38, t + 7.9);
    g.gain.linearRampToValueAtTime(v * 1.0,  t + 8.8);
    g.gain.linearRampToValueAtTime(v * 0.55, t + D);
    o.connect(filt); filt.connect(g); g.connect(dry); g.connect(rev);
    o.start(t); o.stop(t + D + 0.4);
  });

  // Pad: D minor chord (D3 F3 A3), staggered swell
  const padDefs = [
    { f: 146.83, idx: 0, spread: -4.2 },
    { f: 174.61, idx: 1, spread:  4.8 },
    { f: 220.00, idx: 2, spread: -3.0 },
  ];
  padDefs.forEach(({ f, idx, spread }) => {
    for (let s = -1; s <= 1; s += 2) {
      const o = ctx.createOscillator(); o.type = 'triangle';
      const baseF = f + s * 0.6;
      o.frequency.value = baseF;
      const g = ctx.createGain();
      const sw = t + 1.2 + idx * 0.25;
      g.gain.setValueAtTime(0,    sw - 0.1);
      g.gain.linearRampToValueAtTime(0.09,  sw + 1.8);
      g.gain.linearRampToValueAtTime(0.07,  t + 7.0);
      g.gain.linearRampToValueAtTime(0.04,  t + 7.9);
      g.gain.linearRampToValueAtTime(0.015, t + 9.0);
      g.gain.linearRampToValueAtTime(0,     t + D);
      o.frequency.setValueAtTime(baseF, t + 7.8);
      o.frequency.linearRampToValueAtTime(baseF + spread * s, t + D);
      o.connect(g); g.connect(rev); g.connect(dry);
      o.start(sw); o.stop(t + D + 0.4);
    }
  });

  // Ghost note A5
  const gh1 = ctx.createOscillator(); gh1.type = 'sine'; gh1.frequency.value = 880;
  const ghG1 = ctx.createGain();
  ghG1.gain.setValueAtTime(0,     t + 0.5);
  ghG1.gain.linearRampToValueAtTime(0.04,  t + 4.0);
  ghG1.gain.linearRampToValueAtTime(0.04,  t + 8.0);
  ghG1.gain.linearRampToValueAtTime(0.062, t + 8.5);
  ghG1.gain.linearRampToValueAtTime(0.035, t + 8.8);
  ghG1.gain.linearRampToValueAtTime(0.02,  t + D);
  gh1.frequency.setValueAtTime(880, t + 8.0);
  gh1.frequency.linearRampToValueAtTime(897, t + 8.8);
  gh1.frequency.linearRampToValueAtTime(881, t + D);
  gh1.connect(ghG1); ghG1.connect(rev); ghG1.connect(dry);
  gh1.start(t + 0.5); gh1.stop(t + D + 0.4);

  const gh2 = ctx.createOscillator(); gh2.type = 'sine'; gh2.frequency.value = 873;
  const ghG2 = ctx.createGain();
  ghG2.gain.setValueAtTime(0,     t + 7.9);
  ghG2.gain.linearRampToValueAtTime(0.026, t + 8.5);
  ghG2.gain.linearRampToValueAtTime(0.004, t + 8.8);
  ghG2.gain.linearRampToValueAtTime(0,     t + D);
  gh2.frequency.setValueAtTime(873, t + 8.0);
  gh2.frequency.linearRampToValueAtTime(866, t + 8.8);
  gh2.frequency.linearRampToValueAtTime(879, t + D);
  gh2.connect(ghG2); ghG2.connect(rev);
  gh2.start(t + 7.9); gh2.stop(t + D + 0.4);

  // Bell melody A4 → F4 → D4
  [{ time: 2.6, freq: 440, dur: 3.5 }, { time: 5.1, freq: 349.23, dur: 3.0 }, { time: 7.0, freq: 293.66, dur: 2.8 }].forEach(b => {
    const bt = t + b.time;
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = b.freq;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0, bt);
    g1.gain.linearRampToValueAtTime(0.32, bt + 0.008);
    g1.gain.exponentialRampToValueAtTime(0.001, bt + b.dur);
    o1.connect(g1); g1.connect(rev); g1.connect(dry);
    o1.start(bt); o1.stop(bt + b.dur + 0.1);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = b.freq * 2.756;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0, bt);
    g2.gain.linearRampToValueAtTime(0.11, bt + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.001, bt + b.dur * 0.45);
    o2.connect(g2); g2.connect(rev);
    o2.start(bt); o2.stop(bt + b.dur + 0.1);
    const o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = b.freq * 0.5;
    const g3 = ctx.createGain();
    g3.gain.setValueAtTime(0, bt);
    g3.gain.linearRampToValueAtTime(0.07, bt + 0.015);
    g3.gain.exponentialRampToValueAtTime(0.001, bt + b.dur * 0.7);
    o3.connect(g3); g3.connect(rev);
    o3.start(bt); o3.stop(bt + b.dur + 0.1);
  });
}

function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;
  const interleaved = new Int16Array(length * numChannels);

  for (let i = 0; i < length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const s = buffer.getChannelData(ch)[i];
      interleaved[i * numChannels + ch] = Math.max(-32768, Math.min(32767, Math.round(s * 32767)));
    }
  }

  const wavBuffer = new ArrayBuffer(44 + interleaved.byteLength);
  const view = new DataView(wavBuffer);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

  str(0,  'RIFF');
  view.setUint32(4,  36 + interleaved.byteLength, true);
  str(8,  'WAVE');
  str(12, 'fmt ');
  view.setUint32(16, 16, true);           // PCM chunk size
  view.setUint16(20, 1, true);            // PCM format
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);           // bits per sample
  str(36, 'data');
  view.setUint32(40, interleaved.byteLength, true);
  new Int16Array(wavBuffer, 44).set(interleaved);

  return wavBuffer;
}

async function renderAndDownload() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = 'Rendering audio…';

  try {
    const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const totalSamples = Math.ceil(SAMPLE_RATE * RENDER_DURATION);
    const offCtx = new OfflineCtx(2, totalSamples, SAMPLE_RATE);

    renderTheme(offCtx);

    const buffer = await offCtx.startRendering();
    status.textContent = 'Encoding WAV…';

    const wav = audioBufferToWav(buffer);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'mud2_theme_of_the_land.wav';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    status.textContent = 'Done — mud2_theme_of_the_land.wav downloaded.';
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    console.error(e);
  }

  btn.disabled = false;
}
</script>
</body>
</html>
