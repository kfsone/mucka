
<style>
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  #playBtn{cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 22px;border-radius:var(--border-radius-md);background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);font-size:14px;font-family:var(--font-sans);transition:background 0.15s}
  #playBtn:hover{background:var(--color-background-secondary)}
  #playBtn:active{transform:scale(0.98)}
</style>

<h2 class="sr-only">MUD II theme music player — an ambient instrumental for The Land</h2>

<div style="padding:1.5rem 0">
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);padding:1.75rem 1.5rem;max-width:540px">

    <p style="font-size:11px;letter-spacing:0.13em;color:var(--color-text-tertiary);text-transform:uppercase;margin:0 0 6px">MUD II · Richard Bartle · 1985</p>
    <p style="font-size:19px;font-weight:500;color:var(--color-text-primary);margin:0 0 4px">Theme of the Land</p>
    <p style="font-size:13px;color:var(--color-text-secondary);margin:0 0 20px;font-style:italic">distant power &nbsp;·&nbsp; solitude &nbsp;·&nbsp; echoes of glory &nbsp;·&nbsp; distant fog</p>

    <canvas id="viz" width="480" height="64" style="width:100%;height:64px;border-radius:var(--border-radius-md);background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);display:block;margin-bottom:1.25rem"></canvas>

    <div style="display:flex;align-items:center;gap:12px">
      <button id="playBtn" onclick="handlePlay()">
        <i class="ti ti-player-play" id="btnIcon" aria-hidden="true" style="font-size:16px"></i>
        <span id="btnLabel">Play theme</span>
      </button>
      <div style="flex:1;height:3px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden">
        <div id="bar" style="height:100%;width:0%;background:var(--color-text-secondary);border-radius:2px;transition:width 0.08s linear"></div>
      </div>
      <span id="clock" style="font-size:12px;color:var(--color-text-tertiary);min-width:32px;text-align:right">0:00</span>
    </div>

    <p style="font-size:11px;color:var(--color-text-tertiary);margin:14px 0 0;line-height:1.5">
      D minor &nbsp;·&nbsp; bass drone → pad swells → bell triad → drone re-swell + ghost focus &nbsp;·&nbsp; ~10s
    </p>
  </div>
</div>

<script>
const DURATION = 10.4;
let actx = null, playing = false, startTime = 0, rafId = null, nodes = [];

function getCtx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  return actx;
}

function makeReverb(ctx){
  const conv = ctx.createConvolver();
  const sr = ctx.sampleRate, len = Math.floor(sr * 3.4);
  const buf = ctx.createBuffer(2, len, sr);
  for(let c=0;c<2;c++){
    const d = buf.getChannelData(c);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
  }
  conv.buffer = buf;
  return conv;
}

function playTheme(){
  const ctx = getCtx();
  const t = ctx.currentTime + 0.05;
  startTime = t;
  nodes = [];
  const D = DURATION;

  const master = ctx.createGain(); master.gain.value = 0.72; master.connect(ctx.destination);
  const rev = makeReverb(ctx);
  const revG = ctx.createGain(); revG.gain.value = 0.55;
  rev.connect(revG); revG.connect(master);
  const dry = ctx.createGain(); dry.gain.value = 0.45; dry.connect(master);

  // Analyser
  const analyser = ctx.createAnalyser(); analyser.fftSize = 256;
  master.connect(analyser);
  window._analyser = analyser;

  // ── Bass drone D1 + D2 ──
  // Swell in → steady → dip slightly at 7.8 → RE-SWELL at 8.2 → settle
  [[36.71, 0.38, 'sawtooth'], [73.42, 0.22, 'triangle']].forEach(([f, v, type]) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    const filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 200; filt.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v,        t + 2.2);
    g.gain.linearRampToValueAtTime(v * 0.85, t + 6.5);
    g.gain.linearRampToValueAtTime(v * 0.38, t + 7.9);  // pull back to make room
    g.gain.linearRampToValueAtTime(v * 1.0,  t + 8.8);  // RE-SWELL — full authority returns
    g.gain.linearRampToValueAtTime(v * 0.55, t + D);    // settle and breathe out
    o.connect(filt); filt.connect(g); g.connect(dry); g.connect(rev);
    o.start(t); o.stop(t + D + 0.4); nodes.push(o);
  });

  // ── Pad: D minor chord (D3 F3 A3), staggered swell ──
  // From t+7.8: ease gain off AND detune frequencies outward so they smear/dissolve
  // as the bass re-swells, the pad retreats into fog
  const padDefs = [
    { f: 146.83, idx: 0, spread:  -4.2 },  // D3 — drift flat
    { f: 174.61, idx: 1, spread:   4.8 },  // F3 — drift sharp
    { f: 220.00, idx: 2, spread:  -3.0 },  // A3 — drift flat
  ];
  padDefs.forEach(({ f, idx, spread }) => {
    for(let s = -1; s <= 1; s += 2){
      const o = ctx.createOscillator(); o.type = 'triangle';
      const baseF = f + s * 0.6;
      o.frequency.value = baseF;
      const g = ctx.createGain();
      const sw = t + 1.2 + idx * 0.25;
      g.gain.setValueAtTime(0,    sw - 0.1);
      g.gain.linearRampToValueAtTime(0.09, sw + 1.8);
      g.gain.linearRampToValueAtTime(0.07, t + 7.0);
      g.gain.linearRampToValueAtTime(0.04, t + 7.9);   // ease back as bass re-swells
      g.gain.linearRampToValueAtTime(0.015, t + 9.0);  // nearly gone
      g.gain.linearRampToValueAtTime(0,    t + D);
      // Frequency smear: drift away from center — the chord dissolves into mist
      o.frequency.setValueAtTime(baseF, t + 7.8);
      o.frequency.linearRampToValueAtTime(baseF + spread * s, t + D);
      o.connect(g); g.connect(rev); g.connect(dry);
      o.start(sw); o.stop(t + D + 0.4); nodes.push(o);
    }
  });

  // ── Ghost note (A5 = 880 Hz) ──
  // 8.0→8.8: frequency pushed slightly upward, width osc blooms (widening)
  // 8.8→end: frequency narrows back, width osc retreats — a single point of focus
  const gh1 = ctx.createOscillator(); gh1.type = 'sine'; gh1.frequency.value = 880;
  const ghG1 = ctx.createGain();
  ghG1.gain.setValueAtTime(0,     t + 0.5);
  ghG1.gain.linearRampToValueAtTime(0.04,  t + 4.0);
  ghG1.gain.linearRampToValueAtTime(0.04,  t + 8.0);   // hold
  ghG1.gain.linearRampToValueAtTime(0.062, t + 8.5);   // push: slightly louder as it widens
  ghG1.gain.linearRampToValueAtTime(0.035, t + 8.8);   // ease off
  ghG1.gain.linearRampToValueAtTime(0.02,  t + D);     // narrow to a distant point
  // Frequency push: 880 → 896 Hz over 8.0→8.8, then settle back to ~882
  gh1.frequency.setValueAtTime(880, t + 8.0);
  gh1.frequency.linearRampToValueAtTime(897, t + 8.8);
  gh1.frequency.linearRampToValueAtTime(881, t + D);
  gh1.connect(ghG1); ghG1.connect(rev); ghG1.connect(dry);
  gh1.start(t + 0.5); gh1.stop(t + D + 0.4); nodes.push(gh1);

  // Ghost width oscillator — blooms during 8.0→8.8, then closes
  // Sits a tritone-ish below, creates shimmer/width when audible
  const gh2 = ctx.createOscillator(); gh2.type = 'sine'; gh2.frequency.value = 873;
  const ghG2 = ctx.createGain();
  ghG2.gain.setValueAtTime(0,     t + 7.9);
  ghG2.gain.linearRampToValueAtTime(0.026, t + 8.5);   // bloom
  ghG2.gain.linearRampToValueAtTime(0.004, t + 8.8);   // close
  ghG2.gain.linearRampToValueAtTime(0,     t + D);
  // Also drifts outward then back
  gh2.frequency.setValueAtTime(873, t + 8.0);
  gh2.frequency.linearRampToValueAtTime(866, t + 8.8); // drift further away
  gh2.frequency.linearRampToValueAtTime(879, t + D);   // creep back
  gh2.connect(ghG2); ghG2.connect(rev);
  gh2.start(t + 7.9); gh2.stop(t + D + 0.4); nodes.push(gh2);

  // ── Bell melody A4→F4→D4 (unchanged) ──
  [{time:2.6,freq:440,dur:3.5},{time:5.1,freq:349.23,dur:3.0},{time:7.0,freq:293.66,dur:2.8}].forEach(b=>{
    const bt = t + b.time;
    const o1 = ctx.createOscillator(); o1.type='sine'; o1.frequency.value=b.freq;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0,bt);
    g1.gain.linearRampToValueAtTime(0.32,bt+0.008);
    g1.gain.exponentialRampToValueAtTime(0.001,bt+b.dur);
    o1.connect(g1); g1.connect(rev); g1.connect(dry);
    o1.start(bt); o1.stop(bt+b.dur+0.1); nodes.push(o1);
    const o2 = ctx.createOscillator(); o2.type='sine'; o2.frequency.value=b.freq*2.756;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0,bt);
    g2.gain.linearRampToValueAtTime(0.11,bt+0.006);
    g2.gain.exponentialRampToValueAtTime(0.001,bt+b.dur*0.45);
    o2.connect(g2); g2.connect(rev);
    o2.start(bt); o2.stop(bt+b.dur+0.1); nodes.push(o2);
    const o3 = ctx.createOscillator(); o3.type='sine'; o3.frequency.value=b.freq*0.5;
    const g3 = ctx.createGain();
    g3.gain.setValueAtTime(0,bt);
    g3.gain.linearRampToValueAtTime(0.07,bt+0.015);
    g3.gain.exponentialRampToValueAtTime(0.001,bt+b.dur*0.7);
    o3.connect(g3); g3.connect(rev);
    o3.start(bt); o3.stop(bt+b.dur+0.1); nodes.push(o3);
  });
}

function stopTheme(){
  nodes.forEach(n=>{ try{n.stop();}catch(e){} }); nodes=[];
  if(actx){ try{actx.close();}catch(e){} actx=null; }
  window._analyser=null;
}

const bar=document.getElementById('bar'), clock=document.getElementById('clock');
const icon=document.getElementById('btnIcon'), lbl=document.getElementById('btnLabel');
const canvas=document.getElementById('viz'), canCtx=canvas.getContext('2d');

function drawIdle(){
  canCtx.clearRect(0,0,canvas.width,canvas.height);
  canCtx.strokeStyle='rgba(128,128,128,0.18)';
  canCtx.lineWidth=1;
  canCtx.beginPath(); canCtx.moveTo(0,canvas.height/2); canCtx.lineTo(canvas.width,canvas.height/2); canCtx.stroke();
}

function drawWave(){
  if(!window._analyser||!playing) return;
  const buf=new Uint8Array(window._analyser.frequencyBinCount);
  window._analyser.getByteTimeDomainData(buf);
  canCtx.clearRect(0,0,canvas.width,canvas.height);
  canCtx.strokeStyle='rgba(128,128,128,0.52)';
  canCtx.lineWidth=1.4;
  canCtx.beginPath();
  const sl=canvas.width/buf.length;
  buf.forEach((v,i)=>{ const x=i*sl,y=(v/255)*canvas.height; i===0?canCtx.moveTo(x,y):canCtx.lineTo(x,y); });
  canCtx.stroke();
}

function endPlay(){
  playing=false; icon.className='ti ti-player-play'; lbl.textContent='Play theme';
  bar.style.width='0%'; clock.textContent='0:00';
  if(rafId) cancelAnimationFrame(rafId); drawIdle();
}

function tick(){
  if(!playing) return;
  if(!actx){ endPlay(); return; }
  const elapsed = actx.currentTime - startTime;
  if(elapsed >= DURATION){ endPlay(); return; }
  const pct=Math.min(100,(elapsed/DURATION)*100);
  bar.style.width=pct+'%';
  const s=Math.floor(elapsed),m=Math.floor(s/60);
  clock.textContent=m+':'+(s%60<10?'0':'')+(s%60);
  drawWave();
  rafId=requestAnimationFrame(tick);
}

function handlePlay(){
  if(playing){ stopTheme(); endPlay(); }
  else{
    playing=true; icon.className='ti ti-player-pause'; lbl.textContent='Stop';
    playTheme(); rafId=requestAnimationFrame(tick);
  }
}

drawIdle();
</script>
